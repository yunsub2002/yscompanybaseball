<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="KBO Manager"><meta name="theme-color" content="#0a1f16">
<title>KBO 매니저 1996-2027 Ultimate</title><style>
:root{
 --bg:#0d1512;--panel:#14211c;--panel2:#1a2b25;--line:#24392f;--tx:#e6efe9;--mut:#8ea79a;
 --acc:#3ddc84;--acc2:#2bb673;--warn:#f5b942;--bad:#ef5350;--blue:#4aa3ff;--gold:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--panel2);color:var(--tx);font-weight:600;font-size:13px;transition:.15s}
button:hover{filter:brightness(1.2)}
button.pri{background:var(--acc2);color:#05140c}
button.pri:hover{background:var(--acc)}
button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
select,input{font-family:inherit;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:60px 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;background:linear-gradient(90deg,#0a1f16,#123526);border-bottom:1px solid var(--line)}
.top .logo{font-weight:900;letter-spacing:.5px;font-size:17px;color:var(--acc)}
.top .club{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.top .sp{flex:1}
.top .chip{background:rgba(255,255,255,.06);padding:6px 12px;border-radius:20px;font-size:12.5px;color:var(--mut)}
.top .chip b{color:var(--tx)}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.nav button{text-align:left;background:transparent;padding:11px 14px;font-size:14px;color:var(--mut)}
.nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.nav .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{overflow:auto;padding:20px 24px}
h2{margin:0 0 14px;font-size:20px}
h3{margin:0 0 10px;font-size:15px;color:var(--mut);font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:10px;font-weight:900;border:2px solid;flex:none}
.badge.lg{width:56px;height:56px;font-size:15px;border-width:3px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);cursor:default}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
tr.me td{background:rgba(61,220,132,.08)}
tr.hl td{background:rgba(74,163,255,.12)}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{display:inline-block;min-width:30px;text-align:center;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:800}
.pos.GK{background:#a17d14;color:#fff}.pos.D{background:#1f6fb2;color:#fff}.pos.M{background:#2c9a5a;color:#fff}.pos.A{background:#c0392b;color:#fff}
.ovr{display:inline-block;min-width:30px;text-align:center;font-weight:900;border-radius:6px;padding:2px 5px}
.bar{height:7px;border-radius:4px;background:#2a3a33;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}
.mut{color:var(--mut)}.good{color:var(--acc)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--panel2);color:var(--mut)}
.tag.inj{background:#5a1f1f;color:#ffb3b3}.tag.lst{background:#4a3a10;color:var(--gold)}
.news{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.news div{padding:9px 11px;background:var(--panel2);border-radius:9px;font-size:13px;line-height:1.45}
.news small{color:var(--mut);display:block;font-size:11px}
.form i{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;font-style:normal;font-size:11px;font-weight:800;margin-right:3px}
.form .W{background:#2bb673;color:#04140b}.form .D{background:#8a8f8c;color:#111}.form .L{background:#d64541;color:#fff}
/* start screen */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:50px 20px;background:radial-gradient(circle at 50% 0,#1d4a35,#0d1512 60%)}
.start h1{font-size:40px;margin:0;letter-spacing:1px}
.start h1 span{color:var(--acc)}
.start p{color:var(--mut);margin:8px 0 26px}
.clubs{display:grid;grid-template-columns:repeat(4,220px);gap:14px}
.clubc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.clubc:hover{transform:translateY(-3px);border-color:var(--acc)}
.clubc.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.clubc .nm{font-weight:800;font-size:15px}
/* tactics */
.pitch{position:relative;background:repeating-linear-gradient(0deg,#1f6b3f 0 36px,#226f43 36px 72px);border-radius:12px;border:2px solid #3d8b5d;aspect-ratio:68/100;width:100%;max-width:440px;margin:auto;overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.35)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box{position:absolute;left:25%;width:50%;height:15%;border:2px solid rgba(255,255,255,.35)}
.slot{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;cursor:pointer;z-index:2}
.slot .dot{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .lb{font-size:11px;background:rgba(0,0,0,.6);border-radius:5px;padding:2px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.sel .dot{box-shadow:0 0 0 4px var(--gold)}
.slot .ft{height:3px;margin:2px 10px 0;border-radius:2px;background:#333}
.slot .ft i{display:block;height:100%}
.slider{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.slider .lbl{display:flex;justify-content:space-between;font-size:13px}
.seg{display:flex;background:var(--panel2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;padding:7px 4px;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--acc2);color:#05140c}
.strength div{display:grid;grid-template-columns:50px 1fr 36px;gap:8px;align-items:center;margin-bottom:7px;font-size:12.5px}
/* match */
.mwrap{position:fixed;inset:0;background:#08100d;z-index:50;display:grid;grid-template-columns:260px 1fr 260px;grid-template-rows:auto 1fr;gap:12px;padding:12px}
.sb{grid-column:1/4;display:flex;align-items:center;justify-content:center;gap:24px;background:var(--panel);border-radius:14px;padding:12px}
.sb .tm{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;min-width:260px}
.sb .tm.r{justify-content:flex-end}
.sb .sc{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.sb .min{font-size:13px;color:var(--acc);font-weight:800;text-align:center}
.mcol{background:var(--panel);border-radius:14px;padding:12px;overflow:auto}
.mid{display:flex;flex-direction:column;gap:12px;min-height:0}
canvas{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;display:block;background:#1d6b3c}
.comm{flex:1;background:var(--panel);border-radius:14px;padding:12px;overflow:auto;min-height:120px}
.comm div{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px}
.comm div b.m{display:inline-block;width:52px;color:var(--mut)}
.comm .goal{color:var(--gold);font-weight:800;font-size:15px}
.comm .card{background:none;border:0;padding:5px 0;color:var(--warn)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px}
.stat .c{text-align:center;color:var(--mut)}
.stat .dual{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#2a3a33}
.lp{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:12.5px}
.lp .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp.sel{background:rgba(255,209,102,.18);border-radius:6px}
.lp.out{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:flex;align-items:center;justify-content:center}
.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:900px;width:92%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f3a2d;border:1px solid var(--acc2);padding:11px 18px;border-radius:10px;z-index:99;font-weight:600;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.big{font-size:26px;font-weight:900}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--mut);font-size:12px}
@media (max-width:1100px){.mwrap{grid-template-columns:1fr;overflow:auto}.sb{grid-column:1}.g2,.g3{grid-template-columns:1fr}.clubs{grid-template-columns:repeat(2,1fr)}}

/* ---- v2: 드래그 전술판 ---- */
.clubs{grid-template-columns:repeat(5,190px)}
.clubc{padding:14px}
.pitch{max-width:460px;touch-action:none}
.pitch .zg{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.12);pointer-events:none}
.pitch .zl{position:absolute;right:6px;font-size:10px;color:rgba(255,255,255,.35);pointer-events:none;transform:translateY(2px)}
.tok{position:absolute;transform:translate(-50%,-50%);width:88px;text-align:center;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tok .dot{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.tok .lb{font-size:11px;background:rgba(0,0,0,.62);border-radius:5px;padding:2px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .rl{display:inline-block;font-size:9.5px;font-weight:800;background:rgba(5,20,12,.85);color:var(--gold);border-radius:4px;padding:1px 4px;margin-top:2px}
.tok .rt{position:absolute;top:-6px;right:14px;font-size:10px;font-weight:900;background:#0b1a13;border-radius:5px;padding:0 4px;border:1px solid var(--line)}
.tok .ft{height:3px;margin:2px 14px 0;border-radius:2px;background:#333}.tok .ft i{display:block;height:100%}
.tok.empty .dot{background:rgba(0,0,0,.35)!important;border-style:dashed;border-color:#bbb;color:#ddd}
.tok.hurt .dot{background:#5a1f1f!important;border-color:#ef5350;border-style:dashed}
.tok.sel .dot{box-shadow:0 0 0 4px var(--gold)}
.tok.drag-src{opacity:.25;pointer-events:none}
.drop-hi .dot{box-shadow:0 0 0 5px var(--blue)!important}
.benchz.drop-hi{outline:2px dashed var(--blue);outline-offset:3px}
.pitch.drop-hi{box-shadow:0 0 0 3px rgba(74,163,255,.6)}
.dndghost{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.dndghost .dot{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.dndghost .gl{font-size:11px;font-weight:800;background:#0b1a13;border:1px solid var(--acc2);padding:2px 7px;border-radius:6px;white-space:nowrap}
body.dragging,body.dragging *{cursor:grabbing!important}
.bcard{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);margin-bottom:5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:12.5px}
.bcard:hover{filter:brightness(1.15)}
.bcard .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.bcard.na{opacity:.45;cursor:not-allowed}
.bcard.drag-src{opacity:.25}
.benchz{min-height:120px;max-height:640px;overflow:auto}
.tacgrid{display:grid;grid-template-columns:minmax(320px,460px) 250px minmax(300px,1fr);gap:16px;align-items:start}
.stars{color:var(--gold);letter-spacing:-1px;font-size:12px}
.attr{display:grid;grid-template-columns:62px 1fr 28px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:5px}
.mu{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:7px}
.mu .bar{height:9px}
.mubar{position:relative;height:9px;border-radius:5px;background:#2a3a33;overflow:hidden}
.mubar i{position:absolute;top:0;bottom:0}
.mubar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid rgba(255,255,255,.5)}
.tip{font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--panel2);margin-bottom:6px;line-height:1.45}
.tip.g{border-left:3px solid var(--acc)}.tip.b{border-left:3px solid var(--bad)}.tip.n{border-left:3px solid var(--blue)}
.pred{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11.5px;font-weight:800}
.pred div{display:flex;align-items:center;justify-content:center;color:#06120c}
.livebox{max-width:1180px!important}
.livegrid{display:grid;grid-template-columns:minmax(300px,420px) 230px 1fr;gap:14px;align-items:start}
.stbl td,.stbl th{padding:4px 6px;font-size:12px}
#mom{max-height:70px;background:var(--panel)}
tr.z-ucl td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
tr.z-uel td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.z-rel td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.lp .rt2{font-size:11px;font-weight:800;min-width:26px;text-align:right}
@media (max-width:1300px){.tacgrid{grid-template-columns:minmax(300px,440px) 1fr}.tacgrid>.col3{grid-column:1/3}.livegrid{grid-template-columns:1fr 1fr}.livegrid>.col3{grid-column:1/3}}
@media (max-width:1100px){.clubs{grid-template-columns:repeat(2,1fr)}.tacgrid,.livegrid{grid-template-columns:1fr}.tacgrid>.col3,.livegrid>.col3{grid-column:1}}
.pitch .pbox{position:absolute;left:25%;width:50%;height:15%;border:2px solid rgba(255,255,255,.35)}
.mid{overflow:hidden}
.mid canvas#cv{max-height:60vh;background:#174f2b}
#mom{height:46px;max-height:46px;flex:none}
.mlow{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
.mlow>*{min-height:0;overflow:auto}
.mlow .comm{min-height:0}
.livegrid{grid-template-columns:minmax(300px,420px) 260px 1fr}
.rp-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:1100px){.mlow{grid-template-columns:1fr}}

/* ---- v4: 다중 리그 · 대항전 ---- */
.lgtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.lgtabs button{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:20px;color:var(--mut)}
.lgtabs button.on{background:var(--panel2);color:var(--tx);border-color:var(--acc)}
.ctag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--mut);vertical-align:middle}
.tie{padding:8px 10px;background:var(--panel2);border-radius:9px;margin-bottom:6px;font-size:13px}
a.pl{color:var(--tx);font-weight:700;text-decoration:none}a.pl:hover{text-decoration:underline}
.gen{color:var(--mut);font-size:10px;margin-left:2px;vertical-align:super}
tr.z-uecl td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.stbl sup{line-height:0}

.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:900px;width:92%;max-height:90vh;overflow:auto}
a.cl{color:inherit;text-decoration:none;font-weight:700}a.cl:hover{color:var(--acc);text-decoration:underline}
.badge:hover{filter:brightness(1.15);box-shadow:0 0 0 2px var(--acc)}
.clubcard{cursor:pointer;transition:transform .12s,border-color .12s}.clubcard:hover{transform:translateY(-2px);border-color:var(--acc)}.clubcard.me{border-color:var(--acc)}
.stbl tr.hl td{background:rgba(61,220,132,.06)}
.modal .stbl th{white-space:nowrap}
/* ---- v6: 메일함 · 협상 ---- */
.mbadge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:900;text-align:center;margin-left:4px}
.mchips{justify-content:flex-start;margin:4px 0 12px}.mchips button{padding:6px 11px;font-size:12px}
.inbox{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:14px;align-items:start}
.mlist{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 230px);overflow:auto}
.mlist.mini{max-height:none;background:transparent;border:0}
.mi{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mi:hover{background:var(--panel2)}.mi.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
.mi .mic{font-size:18px;flex:none}.mi .mtx{flex:1;min-width:0}.mi small{flex:none;font-size:10.5px}
.mi .mfrom{font-size:11.5px;color:var(--mut)}.mi .msub{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.ur .msub{font-weight:800;color:var(--tx)}.mi.ur .mfrom:before{content:"● ";color:var(--acc)}
.mread{min-height:300px;max-height:calc(100vh - 230px);overflow:auto}
.mbody{margin-top:12px;line-height:1.6;font-size:13.5px}.mbody p{margin:6px 0}.mbody h3{margin-top:12px}
.negbox{background:var(--panel2);border-radius:12px;padding:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}.fld input,.fld select{width:100%}.fld small{font-size:10.5px}
.pat{display:inline-flex;gap:3px;margin-right:6px}.pat i{width:10px;height:10px;border-radius:50%;background:#2a3a33}.pat i.on{background:var(--gold)}
.steps{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.steps span{font-size:12px;padding:4px 10px;border-radius:14px;background:var(--panel2);color:var(--mut)}
.steps span.cur{background:var(--acc2);color:#05140c;font-weight:800}.steps span.ok{color:var(--acc)}
.neglog{background:var(--panel2);border-radius:10px;padding:8px 10px;max-height:160px;overflow:auto;font-size:12.5px}.neglog div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
@media (max-width:1100px){.inbox{grid-template-columns:1fr}}
.top .chip{white-space:nowrap}.top .logo,.top .club{white-space:nowrap}@media (max-width:1400px){.top .logo{font-size:14px}}

/* ================= v7: 아이폰 세로 모드(모바일) 최적화 ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.clubc,.mi,.bcard,.tok,.chip,a{-webkit-tap-highlight-color:rgba(61,220,132,.18);touch-action:manipulation}
.tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:760px){
 html,body{height:auto;min-height:100%;font-size:14px}
 body{overflow-x:hidden}
 body:before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#0a1f16;z-index:45;pointer-events:none}
 button{min-height:38px;padding:8px 12px}

 .card{padding:12px;border-radius:12px;min-width:0}
 .grid{gap:12px;min-width:0}.grid>*{min-width:0}
 .main .row,.modal .row{flex-wrap:wrap}

 /* --- 앱 골격: 사이드바 → 상단 가로 탭 --- */

 .top>button.pri{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;padding:13px 20px;border-radius:28px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.55),0 0 0 2px rgba(61,220,132,.35)}
 .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;flex-direction:row;gap:4px;padding:6px 8px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .nav::-webkit-scrollbar{display:none}

 .nav button.on{box-shadow:inset 0 -3px 0 var(--acc)}
 .nav .foot{flex-direction:row;margin-top:0;margin-left:8px;gap:4px;flex:none}
 .main{overflow:visible;padding:12px 12px calc(90px + env(safe-area-inset-bottom,0px))}

 /* --- 공통 그리드: 1열(지표 카드는 2~3열) --- */
 .g2,.g3,.grid.col3{grid-template-columns:1fr!important}
 .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
 .grid[style*="repeat(4,1fr)"],.grid[style*="repeat(5,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
 .grid[style*="repeat(6,1fr)"],.grid[style*="repeat(3,1fr)"]{grid-template-columns:repeat(3,1fr)!important}
 .grid[style*="auto-fill"]{grid-template-columns:1fr!important}
 .big{font-size:21px}

 /* --- 표: 가로 스크롤 --- */
 th{font-size:11.5px;padding:6px 6px}
 td{padding:6px 6px;font-size:12.5px}

 /* --- 시작 화면 --- */
 .start{padding:calc(24px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px))}
 .start h1{font-size:26px;text-align:center}

 .lgtabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;padding-bottom:4px;scrollbar-width:none}
 .lgtabs::-webkit-scrollbar{display:none}

 .start .row>button.pri{width:100%}

 /* --- 전술판 --- */
 .pitch{max-width:100%;touch-action:pan-y}
 .tok{width:66px}
 .tok .dot,.slot .dot{width:32px;height:32px;font-size:12px}
 .tok .lb,.slot .lb{font-size:9.5px;padding:1px 3px}

 .tacgrid,.livegrid{grid-template-columns:1fr!important}
 .tacgrid>.col3,.livegrid>.col3{grid-column:1!important}

 /* --- 모달 · 토스트 --- */
 .modal{align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
 .modal>.box{width:100%!important;max-width:100%!important;max-height:92dvh;border-radius:16px 16px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px))}

 /* --- 메일함 --- */
 .inbox{grid-template-columns:1fr!important}
 .mlist{max-height:38vh}
 .mread{max-height:none;min-height:0}

 /* --- 경기 화면 --- */
 .mwrap{display:flex!important;flex-direction:column;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(16px + env(safe-area-inset-bottom,0px))}

 .comm{min-height:200px}
 #lh{order:2}#la{order:3}
 .mcol{max-height:48vh}
}
@media (hover:none){

 if(k==='mor'&&p)p.mor=cl((p.mor||3)+f[2],1,5);

 else if(k==='ofs'&&p){p.ofs+=f[2];const o=p.ovr;setOvr(p);if(p.ovr!==o)out.push(`${p.n} 능력 ${o}→${p.ovr}`)}

 else if(k==='ret'&&p){if(p.t)retireNow(p,f[2]);S.retQ=(S.retQ||[]).filter(i=>i!==p.id)}else if(k==='keep'&&p&&p.retW){p.retW=0;p.rtx=S.year+1;p.cy=1;p.exp=0;S.retQ=(S.retQ||[]).filter(i=>i!==p.id);if(f[2]===1){p.sal=+(Math.max(p.sal,salary(p))*1.15).toFixed(2)}else{p.sal=+(salary(p)*.7).toFixed(2);p.coach=1;roster(S.my).forEach(q=>q.mor=cl((q.mor||3)+.2,1,5))}p.mor=cl((p.mor||3)+.5,1,5);news(`🎖️ ${p.n}, 은퇴 번복 · 1년 더 뛴다${f[2]===2?' (플레잉코치)':''}`);out.push(`연봉 ${ok(p.sal)}억 · 1년 계약`)}

function placeAt(id,pos){const T=S.teams[S.my],p=S.P[id];if(!p||p.t!==S.my||isP(p)||p.inj||p.away)return;const idx=T.lineup.findIndex(x=>x.pos===pos);if(idx<0)return;const j=T.lineup.findIndex(x=>x.id===id);
 if(j>=0){const op=T.lineup[j].pos;T.lineup[j].pos=pos;T.lineup[idx].pos=op}else{if(!promote(p))return;T.lineup[idx].id=id}}

function placeOrd(id,j){const T=S.teams[S.my];const i=T.lineup.findIndex(x=>x.id===id);if(i>=0){moveOrd(i,j);return}const p=S.P[id];if(!p||isP(p)||!promote(p))return;T.lineup[j].id=id}
function pLoc(id){const T=S.teams[S.my];const i=T.rot.indexOf(id);if(i>=0)return['rot',i];if(T.pen.cl===id)return['cl'];const j=(T.pen.su||[]).indexOf(id);if(j>=0)return['su',j];if(T.pen.lr===id)return['lr'];return null}

function dropOn(src,dst){const [sk,sv]=src.split(':'),[dk,dv]=dst.split(':');const T=S.teams[S.my];
 if(sk==='h'){if(dk==='pos')placeAt(+sv,dv);else if(dk==='ord')placeOrd(+sv,+dv);else return}
 else if(sk==='s'){if(dk==='pos')swapPos(sv,dv);else if(dk==='hb')placeAt(+dv,sv);else if(dk==='bench'){toast('벤치 선수 위에 놓으면 교체됩니다');return}else if(dk==='ord'){const i=T.lineup.findIndex(x=>x.pos===sv);moveOrd(i,+dv);return}else return}
 else if(sk==='o'){if(dk==='ord'){moveOrd(+sv,+dv);return}else if(dk==='hb'){placeAt(+dv,T.lineup[+sv].pos)}else if(dk==='pos'){const x=T.lineup[+sv];swapPos(x.pos,dv)}else return}
 else if(sk==='p'){setPit(+sv,dst)}

function oSwap(a,b){const T=S.teams[S.my],[ak,av]=a.split(':'),[bk,bv]=b.split(':');
 if(ak==='o'&&bk==='o'){const i=+av,j=+bv;const A=S.P[T.lineup[i].id],B=S.P[T.lineup[j].id];[T.lineup[i],T.lineup[j]]=[T.lineup[j],T.lineup[i]];save();render();toast(`${A.n} ${j+1}번 ↔ ${B.n} ${i+1}번`);return}

function tapSlot(loc){if(dndRecent())return;const cur=pGet(locOf(loc));if(SEL&&SEL.startsWith('p:')){const id=+SEL.split(':')[1];SEL=null;if(id!==cur){const a=S.P[id],b=S.P[cur];setPit(id,loc);toast(b?`${a.n} ↔ ${b.n} 보직 교체`:`${a.n} → ${slotLbl(loc)}`)}save();render();return}

let DND=null,DND_T=0,DND_RAF=0;
const dndRecent=()=>performance.now()-DND_T<380;
function dropLbl(dst){if(!dst)return'';const [k,v]=dst.split(':');const T=S.teams[S.my];
 if(k==='ord')return `${+v+1}번 타순`;if(k==='pos')return PKO[v]||v;if(k==='hb'){const p=S.P[+v];return p?`${p.n}와 교체`:''}

function dndBegin(el,x,y,touch,handle){if(DND)dndKill();DND={src:el.dataset.drag,el,x,y,cx:x,cy:y,on:false,moved:false,touch};
 if(touch&&!handle)DND.lp=setTimeout(()=>{if(DND&&!DND.on){buzz(15);dndStart()}},180);
 if(touch&&!handle)el.classList.add('lp-wait');}
function dndStart(){const D=DND;if(!D||D.on)return;clearTimeout(D.lp);D.on=true;D.moved=true;
 const g=document.createElement('div');g.className='dndghost';const nm=(D.el.querySelector('.nm,.lb')||D.el).textContent.trim().replace(/\s+/g,' ').slice(0,14);
 g.innerHTML=`<div class="dot" style="background:var(--acc2);color:#05140c">⚾</div><div class="gl">${nm}<span class="to"></span></div>`;document.body.appendChild(g);D.g=g;
 document.body.classList.add('dragging');D.el.classList.add('drag-src');D.el.classList.remove('lp-wait');dndApply();dndScrollLoop()}
function dndMove(x,y){const D=DND;if(!D)return;D.cx=x;D.cy=y;if(!D.on)return;if(D.mq)return;D.mq=requestAnimationFrame(()=>{if(DND!==D)return;D.mq=0;dndApply()})}
function dndApply(){const D=DND;if(!D||!D.on)return;const x=D.cx,y=D.cy;
 D.g.style.transform=`translate3d(${Math.max(80,Math.min(window.innerWidth-80,x))}px,${y-(D.touch?54:0)}px,0) translate(-50%,-50%)`;
 const t=document.elementFromPoint(x,y);let d=t&&t.closest('[data-drop]');if(d===D.el)d=null;if(D.hi===d)return;if(D.hi)D.hi.classList.remove('drop-hi');
 const to=D.to||(D.to=D.g.querySelector('.to'));if(d&&d!==D.el){d.classList.add('drop-hi');D.hi=d;const l=dropLbl(d.dataset.drop);to.innerHTML=l?` → <b>${l}</b>`:'';if(D.touch)buzz(6)}else{D.hi=null;to.innerHTML=''}}
function dndScrollLoop(){cancelAnimationFrame(DND_RAF);const tick=()=>{const D=DND;if(!D||!D.on)return;const h=window.innerHeight,edge=Math.min(90,h*.12);let v=0;
  if(D.cy<edge)v=-Math.ceil((edge-D.cy)/5);else if(D.cy>h-edge)v=Math.ceil((D.cy-(h-edge))/5);
  if(v){window.scrollBy(0,v);const m=$('#main');if(m&&m.scrollHeight>m.clientHeight+4)m.scrollTop+=v;const hz=D.hi&&D.hi.closest('.benchz');if(hz&&hz.scrollHeight>hz.clientHeight)hz.scrollTop+=v;dndApply()}
  DND_RAF=requestAnimationFrame(tick)};DND_RAF=requestAnimationFrame(tick)}
function dndKill(){const D=DND;if(!D)return;clearTimeout(D.lp);cancelAnimationFrame(DND_RAF);if(D.mq)cancelAnimationFrame(D.mq);D.el.classList.remove('lp-wait','drag-src');if(D.g)D.g.remove();if(D.hi)D.hi.classList.remove('drop-hi');document.body.classList.remove('dragging');DND=null}
function dndFinish(x,y,cancel){const D=DND;if(!D)return;const was=D.on;let dst=null;
 if(was&&!cancel){if(D.touch&&!x&&!y){x=D.cx;y=D.cy}const t=document.elementFromPoint(x,y);const d=t&&t.closest('[data-drop]');if(d&&d!==D.el)dst=d.dataset.drop;else if(D.hi&&D.hi!==D.el)dst=D.hi.dataset.drop}
 dndKill();if(was)DND_T=performance.now();if(dst)dropOn(D.src,dst)}

  if(D.lp){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2&&e.cancelable){dndStart()}else if(dist>12){dndKill();return}else return}
